# detoxnews.jp（Xserver）へ FTP で同期する。
# prod-jp ブランチに push すると走る。手動実行も可。
# FTPユーザー deploy@detoxnews.jp は接続先が detoxnews.jp/public_html に
# 固定されているので、ログイン地点がそのまま公開ディレクトリになる。

name: Deploy to Xserver (detoxnews.jp)

on:
  push:
    branches: [prod-jp]
  workflow_dispatch:

concurrency:
  group: deploy-xserver-jp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: FTP deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.XSERVER_FTP_HOST }}
          username: ${{ secrets.XSERVER_FTP_USER_JP }}
          password: ${{ secrets.XSERVER_FTP_PASSWORD_JP }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/*.md
