# DetoxNews と睡眠力診断（shindan）を Xサーバーの本番へ FTP で同期する。
# prod-assets ブランチに push すると走る。手動実行も可。
#
# 【重要】public_html 直下の shindan.rentalloungeomiya.com/ は診断サイトの
# ドキュメントルート。このリポジトリの同名フォルダから同期している。
# マスターは ikuro0413/night-sovereignty-check（更新時はそちらのHEADをここへコピーする）。
# ローカルの shindan.rentalloungeomiya.com/ フォルダを削除して push すると
# 差分同期がサーバー側の診断サイトも削除するので、絶対に消さないこと。

name: Deploy to Xserver

on:
  push:
    branches: [prod-assets]
  workflow_dispatch:

concurrency:
  group: deploy-xserver
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: FTP deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.XSERVER_FTP_HOST }}
          username: ${{ secrets.XSERVER_FTP_USER }}
          password: ${{ secrets.XSERVER_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          # deploy@rentalloungeomiya.com は接続先が public_html に固定されているので
          # ログイン地点がそのまま公開ディレクトリになる
          server-dir: ./
          # 差分同期。初回は .ftp-deploy-sync-state.json が無いので全ファイルを上げる
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/*.md
